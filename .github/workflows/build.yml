name: Build & Deploy Articles

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Overleaf articles
        env:
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
        run: |
          chmod +x ./scripts/clone_overleaf_articles.sh
          ./scripts/clone_overleaf_articles.sh

      - name: Verify cloned articles
        run: |
          EXPECTED=$(awk 'NF && $1 !~ /^#/ {count++} END {print count+0}' overleaf_repos.txt)
          ACTUAL=$(find articles -mindepth 2 -maxdepth 2 -type f -name main.tex | wc -l)

          echo "Expected articles: $EXPECTED"
          echo "Cloned articles:   $ACTUAL"

          if [ "$EXPECTED" -eq 0 ] || [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "ERROR: Not all configured articles were cloned."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-lang-european \
            biber \
            curl \
            lmodern \
            lynx

      - name: Convert LaTeX to HTML
        run: |
          chmod +x ./scripts/convert_articles.sh
          ./scripts/convert_articles.sh

      - name: Verify generated articles
        run: |
          EXPECTED=$(awk 'NF && $1 !~ /^#/ {count++} END {print count+0}' overleaf_repos.txt)
          ACTUAL=$(find output/articles -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)

          echo "Expected HTML articles: $EXPECTED"
          echo "Generated HTML articles: $ACTUAL"

          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "ERROR: Article conversion is incomplete."
            exit 1
          fi

      - name: Generate article index
        run: |
          chmod +x ./scripts/generate_index.sh
          ./scripts/generate_index.sh

      - name: Verify article index
        run: |
          EXPECTED=$(awk 'NF && $1 !~ /^#/ {count++} END {print count+0}' overleaf_repos.txt)
          ACTUAL=$(grep -c '<article>' output/index.html || true)

          echo "Expected index entries: $EXPECTED"
          echo "Generated index entries: $ACTUAL"

          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "ERROR: Homepage article list is incomplete."
            exit 1
          fi

      - name: Disable Jekyll
        run: touch output/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output